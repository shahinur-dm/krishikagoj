<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel — Nizamul Haq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div id="login-screen" class="login-wrap">
    <form id="login-form" class="login-card">
      <div class="login-brand"><i class="fa-solid fa-shield-halved"></i></div>
      <p class="eyebrow">Authorized editors only</p>
      <h1>Admin Panel</h1>
      <p class="hint">Sign in to manage portfolio content, media, and messages.</p>
      <label>Username<input name="user" autocomplete="username" placeholder="Enter username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter password" required /></label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
      <a class="back" href="/"><i class="fa-solid fa-arrow-up-right-from-square"></i> View live website</a>
    </form>
  </div>

  <div id="app" hidden>
    <aside class="side">
      <div class="side-brand">
        <span class="avatar">NH</span>
        <div>
          <strong>Nizamul Haq</strong>
          <span>Content Management</span>
        </div>
      </div>
      <nav>
        <button type="button" data-tab="profile" class="active"><i class="fa-solid fa-user"></i> Profile</button>
        <button type="button" data-tab="news"><i class="fa-solid fa-newspaper"></i> Reports</button>
        <button type="button" data-tab="media"><i class="fa-solid fa-tower-broadcast"></i> Media</button>
        <button type="button" data-tab="videos"><i class="fa-solid fa-circle-play"></i> Videos</button>
        <button type="button" data-tab="about"><i class="fa-solid fa-id-card"></i> About</button>
        <button type="button" data-tab="gallery"><i class="fa-solid fa-images"></i> Gallery</button>
        <button type="button" data-tab="inbox"><i class="fa-solid fa-inbox"></i> Messages</button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noreferrer"><i class="fa-solid fa-globe"></i> View live site</a>
        <button type="button" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <p class="top-kicker">Dashboard</p>
          <h2 id="panel-title">Profile</h2>
        </div>
        <button type="button" class="save" id="save-all"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
      </header>
      <p id="toast" class="toast" hidden></p>
      <section class="panel" data-panel="profile"></section>
      <section class="panel" data-panel="news" hidden></section>
      <section class="panel" data-panel="media" hidden></section>
      <section class="panel" data-panel="videos" hidden></section>
      <section class="panel" data-panel="about" hidden></section>
      <section class="panel" data-panel="gallery" hidden></section>
      <section class="panel" data-panel="inbox" hidden>
        <div id="inbox-list" class="inbox"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
